<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | ErgoStarter</title>

    <meta name="robots" content="noindex, follow">
    <meta name="description" content="The page you're looking for could not be found. Explore ergonomic workspace guides and budget-friendly desk setup recommendations on ErgoStarter.">

    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/responsive.css">
    <link rel="stylesheet" href="/assets/css/layout-refinement.css">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="ErgoStarter">
    <meta property="og:title" content="Page Not Found | ErgoStarter">
    <meta property="og:description" content="Explore practical ergonomic workspace guides and budget-friendly desk setup ideas.">
    <meta property="og:url" content="https://ergostarter.pro/404.html">

    <style>
        .error-page {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 90px 24px;
            background: #f7f6f0;
            text-align: center;
        }

        .error-content {
            width: 100%;
            max-width: 680px;
            margin: auto;
        }

        .error-code {
            margin: 0 0 8px;
            color: #254c3b;
            font-family: Georgia, serif;
            font-size: clamp(100px, 20vw, 190px);
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -10px;
        }

        .error-label {
            display: inline-block;
            margin: 20px 0;
            padding: 9px 16px;
            border-radius: 50px;
            background: #dce6d8;
            color: #254c3b;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .error-content h1 {
            margin: 12px 0 16px;
            color: #172b22;
            font-family: Georgia, serif;
            font-size: clamp(32px, 5vw, 48px);
            line-height: 1.15;
        }

        .error-description {
            max-width: 500px;
            margin: 0 auto;
            color: #777d75;
            font-size: 17px;
            line-height: 1.8;
        }

        .error-actions {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 34px;
        }

        .error-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            padding: 14px 24px;
            border: 1px solid #254c3b;
            border-radius: 50px;
            background: #254c3b;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .error-button:hover {
            background: #172b22;
            transform: translateY(-2px);
        }

        .error-button.secondary {
            background: transparent;
            color: #254c3b;
        }

        .error-button.secondary:hover {
            background: #dce6d8;
        }

        .error-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 24px;
            margin-top: 42px;
        }

        .error-links a {
            color: #254c3b;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .error-links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .error-page {
                min-height: 65vh;
                padding: 65px 20px;
            }

            .error-code {
                letter-spacing: -6px;
            }

            .error-description {
                font-size: 15px;
            }

            .error-actions {
                flex-direction: column;
            }

            .error-button {
                width: 100%;
            }

            .error-links {
                gap: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .error-button {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <div id="site-header"></div>

    <main>
        <section class="error-page">
            <div class="error-content">

                <p class="error-code" aria-hidden="true">404</p>

                <span class="error-label">Page Not Found</span>

                <h1>Looks like you've lost your way.</h1>

                <p class="error-description">
                    The page you're looking for may have moved, been removed,
                    or never existed. Don't worry — let's help you find your
                    way back to a better workspace.
                </p>

                <div class="error-actions">
                    <a href="/" class="error-button">
                        Back to Homepage &rarr;
                    </a>

                    <a href="/guides/" class="error-button secondary">
                        Explore Guides
                    </a>
                </div>

                <nav class="error-links" aria-label="Helpful pages">
                    <a href="/gear/">Browse Budget Gear</a>
                    <a href="/about/">About ErgoStarter</a>
                </nav>

            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="/assets/js/components.js"></script>

</body>
</html>
